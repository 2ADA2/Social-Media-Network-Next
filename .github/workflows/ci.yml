name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check .

  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers for Vitest
        run: npx playwright install chromium --with-deps

      - name: Run tests with coverage
        run: npm run coverage

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t social-network:${{ github.sha }} .

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          npm run backend > backend.log 2>&1 &
          echo "Backend started in background"

      - name: Start frontend
        run: |
          npm run dev > frontend.log 2>&1 &
          echo "Frontend started in background"

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://127.0.0.1:4000/api/posts http://127.0.0.1:3000 --timeout 60000

      - name: Show logs if wait-on failed
        if: failure()
        run: |
          echo "=== BACKEND LOGS ==="
          cat backend.log || echo "backend.log not found"
          echo "=== FRONTEND LOGS ==="
          cat frontend.log || echo "frontend.log not found"

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            backend.log
            frontend.log
            playwright-report/

      - name: Kill background processes
        if: always()
        run: |
          kill $(jobs -p) || true
